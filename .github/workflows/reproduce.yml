name: Reproduce sports studies
on:
  push:
  pull_request:
jobs:
  soccer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soccer
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ../restore_large_files.py
      - run: pip install -r requirements-lock.txt
      - run: python run.py
      - run: python -m unittest discover -s tests -v
      - run: python build_report.py
      - run: node tests/check_explorer.cjs
  basketball:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: basketball
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ../restore_large_files.py
      - run: pip install -r requirements-lock.txt
      - run: python run.py
      - run: python -m unittest discover -s tests -v
      - run: python build_report.py
      - run: node tests/check_explorer.cjs
